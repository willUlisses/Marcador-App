name: Pipeline CI - Marcador API
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: 21
          cache: maven

      - name: Run unit Tests with Maven
        run: mvn clean test

      - name: Build Application Package
        run: mvn package -DskipTests

