name: Pipeline CI - Marcador API
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'marcador-api/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'marcador-api/**'


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./marcador-api

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: 21
          cache: maven

      - name: Run unit Tests with Maven
        run: mvn clean test

      - name: Build Application Package
        run: mvn package -DskipTests

